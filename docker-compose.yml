
  version: '3.8'

  services:
    postgres:
      image: postgres:15
      container_name: medresponse-db
      environment:
        POSTGRES_DB: medresponse
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - medresponse_data:/var/lib/postgresql/data

    rabbitmq:
      image: rabbitmq:3-management
      container_name: medresponse-rabbitmq
      ports:
        - "5672:5672"
        - "15672:15672"
      environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest

  volumes:
    medresponse_data: